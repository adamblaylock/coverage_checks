services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: fcc-coverage-postgis
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fcc_coverage}
      POSTGRES_USER: ${POSTGRES_USER:-fcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fcc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fcc_postgis_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fcc} -d ${POSTGRES_DB:-fcc_coverage}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 1gb

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fcc-coverage-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  fcc_postgis_data:

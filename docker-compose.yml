services:
  postgis:
    image: imresamu/postgis:16-3.4
    platform: linux/arm64
    container_name: fcc_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: fcc_coverage
      POSTGRES_USER: fcc
      POSTGRES_PASSWORD: fcc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
